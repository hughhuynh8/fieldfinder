name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      # A fake, obviously non-secret sentinel planted as the server-only Mapbox token: if any client
      # code read it, the scan below finds it in .next/static (PR 2.13 acceptance).
      - run: pnpm build
        env:
          MAPBOX_GEOCODING_TOKEN: pk.ci-bundle-sentinel-not-a-real-token
      - name: No server secrets in the client bundle
        run: pnpm check:client-bundle
        env:
          MAPBOX_GEOCODING_TOKEN: pk.ci-bundle-sentinel-not-a-real-token
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total;console.log(`lines ${t.lines.pct}% · branches ${t.branches.pct}% · functions ${t.functions.pct}%`)' >> "$GITHUB_STEP_SUMMARY"
          fi

  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit plus its first parent (the base branch tip), for the diff below.
          fetch-depth: 2
      # Supabase takes ~2.5 min to start, so PRs that can't affect the database or the code that talks
      # to it skip it. The job still succeeds, so the required check stays meaningful. Pushes to main
      # always run it, and any doubt (e.g. the diff fails) runs it too.
      - name: Detect database-related changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # --no-renames lists a rename as delete + add, so moving a file OUT of supabase/ still counts.
          run=true
          if [ "$EVENT_NAME" = "pull_request" ] && changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"; then
            # Migrations and seed (pgTAP), plus the server code and test setup the integration tests exercise.
            if ! grep -qE '^(supabase/|tests/(fixtures|integration|setup)/|src/(app/api|lib|features)/|scripts/|vitest\.config\.ts$|package\.json$|pnpm-lock\.yaml$|\.nvmrc$|\.github/workflows/ci\.yml$)' <<< "$changed"; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "false" ]; then
            echo "No database or server code changed: Supabase, pgTAP and integration tests skipped (they always run on main)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      # Postgres for migrations, pgTAP and integration tests, plus Storage (storage-api) and its gateway
      # (kong) for the media tests' S3 and public-URL calls (PR 2.12). The rest of the stack is skipped.
      # `db:start` on a fresh runner already applies every migration and the seed, so no `db:reset`.
      - if: steps.changes.outputs.run == 'true'
        run: pnpm db:start -x gotrue,realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - if: steps.changes.outputs.run == 'true'
        run: pnpm test:db
      # API routes against the seeded database, connected as the app roles. The integration project's
      # global setup gives those roles throwaway local-only logins and refuses any non-local host.
      - if: steps.changes.outputs.run == 'true'
        run: pnpm test:integration

  # Lighthouse budgets (PR 4.5): LCP < 2.5 s on the detail pages and a JS transfer budget for `/`,
  # mobile emulation with DevTools throttling (lighthouserc.json). Built against the LOCAL seeded
  # database with the real Mapbox map (a placeholder pk. token: tiles fail, the library still loads)
  # and a placeholder Sentry DSN (so the lazy SDK chunk is counted). Every value below is local-only.
  perf:
    name: perf
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL_PUBLIC_READER: postgres://ff_public_reader:ff_local_reader@127.0.0.1:54322/postgres
      MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:54321/storage/v1/object/public/media-public
      SEARCH_CURSOR_SECRET: integration-test-cursor-secret-not-for-production
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.perf-not-a-real-token
      NEXT_PUBLIC_SENTRY_DSN: https://perfpublickey@127.0.0.1/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start -x gotrue,realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm perf:setup
      - run: pnpm build
      # Uses the runner's preinstalled Google Chrome.
      - run: pnpm perf
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Fails on high/critical advisories in production dependencies.
      - run: pnpm audit --prod --audit-level high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Runs the MIT-licensed gitleaks CLI directly rather than the gitleaks GitHub Action (which needs
      # a paid licence for organisation repos), so the scan doesn't depend on who owns the repo.
      # Version and checksum are pinned (from the release's checksums.txt).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        # .gitleaks.toml extends the default rules with FieldFinder's admin token format.
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .'
